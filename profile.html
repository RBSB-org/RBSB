<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | RBSB EVENTS</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .profile-page {
            min-height: 75vh;
            padding: 50px 20px;
            background: #faf8f3;
        }

        .profile-card {
            max-width: 650px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(20, 36, 58, 0.10);
            text-align: center;
        }

        .profile-card h1 {
            color: #14243a;
            margin-bottom: 10px;
        }

        .profile-card .subtitle {
            color: #667085;
            margin-bottom: 25px;
        }

        .profile-picture {
            width: 145px;
            height: 145px;
            margin: 20px auto;
            border-radius: 50%;
            border: 4px solid #c5a46d;
            object-fit: cover;
            background: #e9dfc9;
            display: block;
        }

        .upload-label {
            display: inline-block;
            padding: 12px 22px;
            background: #14243a;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }

        .upload-label:hover {
            background: #253e5d;
        }

        .profile-input {
            width: 100%;
            max-width: 420px;
            padding: 13px;
            margin: 8px 0 18px;
            border: 1px solid #d8dce3;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .profile-info {
            margin-top: 25px;
            text-align: left;
        }

        .profile-info label {
            display: block;
            color: #14243a;
            font-weight: 600;
            margin-top: 15px;
        }

        .profile-info p {
            color: #667085;
            overflow-wrap: anywhere;
        }

        .profile-button {
            display: inline-block;
            padding: 13px 24px;
            margin: 10px 5px;
            border: none;
            border-radius: 8px;
            background: #c5a46d;
            color: #14243a;
            font-weight: bold;
            cursor: pointer;
        }

        .profile-button:hover {
            opacity: 0.88;
        }

        .profile-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .profile-message {
            min-height: 24px;
            margin-top: 15px;
            overflow-wrap: anywhere;
        }

        @media (max-width: 500px) {
            .profile-card {
                padding: 22px 16px;
            }
        }
    </style>
</head>

<body class="auth-page">

    <!-- HEADER -->
    <header class="site-header">

        <div class="logo">
            <a href="index.html">RBSB<span>EVENTS</span></a>
        </div>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a href="venues.html">Venues</a>
            <a href="services.html">Services</a>
            <a href="budget.html">Budget Planner</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="header-actions">
            <!-- auth-nav.js will replace this with the user menu -->
        </div>

    </header>


    <!-- PROFILE SECTION -->
    <main class="profile-page">

        <section class="profile-card">

            <h1>My Profile</h1>

            <p class="subtitle">
                Make your RBSB Events account your own!
            </p>

            <!-- PROFILE PICTURE -->
            <img
                id="profilePicture"
                class="profile-picture"
                alt="Your profile picture"
                src="https://placehold.co/200x200/e9dfc9/14243a?text=Profile">

            <div>
                <label for="pictureInput" class="upload-label">
                    📸 Choose Profile Picture
                </label>

                <input
                    type="file"
                    id="pictureInput"
                    accept="image/*"
                    hidden>
            </div>

            <p id="pictureMessage" class="profile-message" role="status"></p>


            <!-- USER INFORMATION -->
            <div class="profile-info">

                <label for="profileName">Your Name</label>

                <input
                    type="text"
                    id="profileName"
                    class="profile-input"
                    placeholder="Enter your name"
                    maxlength="80">

                <label for="profileEmail">Email Address</label>

                <p id="profileEmail">Loading...</p>

            </div>


            <button
                type="button"
                id="saveProfileBtn"
                class="profile-button">
                Save Profile
            </button>

            <button
                type="button"
                id="logoutBtn"
                class="profile-button">
                🚪 Logout
            </button>

            <p
                id="profileMessage"
                class="profile-message"
                role="status"
                aria-live="polite">
            </p>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-bottom">
            <p>
                &copy; 2026 RBSB EVENTS.
                Created as a student web-development project.
            </p>
        </div>
    </footer>


    <!-- FIREBASE PROFILE SCRIPT -->
    <script type="module">

        import { auth } from "./firebase.js";

        import {
            onAuthStateChanged,
            updateProfile,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";


        const profilePicture =
            document.getElementById("profilePicture");

        const pictureInput =
            document.getElementById("pictureInput");

        const pictureMessage =
            document.getElementById("pictureMessage");

        const profileName =
            document.getElementById("profileName");

        const profileEmail =
            document.getElementById("profileEmail");

        const saveProfileBtn =
            document.getElementById("saveProfileBtn");

        const logoutBtn =
            document.getElementById("logoutBtn");

        const profileMessage =
            document.getElementById("profileMessage");


        let currentUser = null;
        let selectedPicture = null;

        const defaultPicture =
            "https://placehold.co/200x200/e9dfc9/14243a?text=Profile";


        // Load the saved picture for this Firebase user.
        function loadProfilePicture(user) {

            const savedPicture = localStorage.getItem(
                "rbsb_profile_picture_" + user.uid
            );

            profilePicture.src =
                savedPicture || user.photoURL || defaultPicture;
        }


        // CHECK LOGIN STATUS
        onAuthStateChanged(auth, function (user) {

            if (!user) {
                window.location.replace("login.html");
                return;
            }

            currentUser = user;

            profileName.value = user.displayName || "";

            profileEmail.textContent =
                user.email || "No email available";

            loadProfilePicture(user);
        });


        // CHOOSE A PICTURE
        pictureInput.addEventListener("change", function () {

            const file = pictureInput.files[0];

            if (!file) return;

            if (!file.type.startsWith("image/")) {

                pictureMessage.textContent =
                    "Please choose an image file.";

                pictureInput.value = "";
                return;
            }

            if (file.size > 2 * 1024 * 1024) {

                pictureMessage.textContent =
                    "Please choose a picture smaller than 2 MB.";

                pictureInput.value = "";
                return;
            }

            const reader = new FileReader();

            reader.onload = function (event) {

                selectedPicture = event.target.result;

                // Preview the selected picture.
                profilePicture.src = selectedPicture;

                pictureMessage.textContent =
                    "Picture selected! Click Save Profile to save it.";
            };

            reader.onerror = function () {

                pictureMessage.textContent =
                    "Could not read this image. Please try another.";

            };

            reader.readAsDataURL(file);
        });


        // SAVE PROFILE
        saveProfileBtn.addEventListener("click", async function () {

            if (!currentUser) {
                profileMessage.textContent =
                    "Please log in before saving your profile.";
                return;
            }

            const name = profileName.value.trim();

            if (!name) {
                profileMessage.textContent =
                    "Please enter your name.";
                return;
            }

            saveProfileBtn.disabled = true;

            profileMessage.textContent = "Saving profile...";

            try {

                // Save the user's name in Firebase Authentication.
                await updateProfile(currentUser, {
                    displayName: name
                });

                // Save the picture under the same key used by auth-nav.js.
                if (selectedPicture) {

                    const pictureKey =
                        "rbsb_profile_picture_" + currentUser.uid;

                    try {

                        localStorage.setItem(
                            pictureKey,
                            selectedPicture
                        );

                    } catch (storageError) {

                        throw new Error(
                            "The browser could not save this picture. Please choose a smaller image."
                        );
                    }

                    selectedPicture = null;

                }

                // Refresh the profile picture from saved storage.
                loadProfilePicture(currentUser);

                //pictureMessage.textContent = "";

                profileMessage.textContent =
    "Your profile has been saved successfully! Redirecting to home...";

setTimeout(() => {
    window.location.href = "index.html";
}, 1000);
            } catch (error) {

                console.error("Profile save error:", error);

                profileMessage.textContent =
                    error.message || "Unable to save your profile.";

            } finally {

                saveProfileBtn.disabled = false;
            }
        });


        // LOGOUT
        logoutBtn.addEventListener("click", async function () {

            try {

                await signOut(auth);

                window.location.replace("login.html");

            } catch (error) {

                console.error("Logout error:", error);

                profileMessage.textContent =
                    "Unable to log out. Please try again.";
            }
        });

    </script>

    <!-- SHARED NAVIGATION -->
    <script type="module" src="auth-nav.js"></script>
<!-- RBSB EVENTS GLOBAL THEME LOADER -->
<script>
(function () {
    const THEME_KEY = "rbsbAdminTheme";

    function loadRBSBTheme() {
        let savedTheme;

        try {
            savedTheme = localStorage.getItem(THEME_KEY);
        } catch (error) {
            console.error("RBSB theme storage unavailable:", error);
            return;
        }

        if (!savedTheme) return;

        try {
            const theme = JSON.parse(savedTheme);
            const root = document.documentElement;

            if (theme.primary) {
                root.style.setProperty("--primary", theme.primary);
                root.style.setProperty("--primary-color", theme.primary);
                root.style.setProperty("--navy", theme.primary);
                root.style.setProperty("--navy-light", theme.primary);
            }

            if (theme.accent) {
                root.style.setProperty("--accent", theme.accent);
                root.style.setProperty("--accent-color", theme.accent);
                root.style.setProperty("--gold", theme.accent);
                root.style.setProperty("--gold-light", theme.accent);
            }

            if (theme.background) {
                root.style.setProperty("--page-bg", theme.background);
                root.style.setProperty("--background-color", theme.background);
                root.style.setProperty("--ivory", theme.background);
            }

        } catch (error) {
            console.error("Could not load RBSB theme:", error);
        }
    }

    loadRBSBTheme();
})();
</script>
</body>
</html>
